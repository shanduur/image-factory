parameters:
- $ref: ../components/parameters.yaml#/SchematicID
- $ref: ../components/parameters.yaml#/TalosVersion
- $ref: ../components/parameters.yaml#/Architecture
get:
  operationId: getSPDX
  summary: Get a merged SPDX document
  tags:
  - Enterprise Frontend API
  description: >-
    Returns an SPDX 2.3 JSON document for Talos and the schematic system extensions.
  x-image-factory-access:
    machineScope: denied
    ownership: enforced
  x-image-factory-min-talos-version: v1.11.0
  x-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/SPDXResponse"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headSPDX
  summary: Inspect a merged SPDX document
  tags:
  - Enterprise Frontend API
  description: >-
    Returns SPDX document status and headers without returning the document body.
  x-image-factory-access:
    machineScope: denied
    ownership: enforced
  x-image-factory-min-talos-version: v1.11.0
  x-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
