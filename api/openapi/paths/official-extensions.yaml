parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: listOfficialExtensions
  summary: List official system extensions
  tags:
  - Frontend API
  description: >-
    Lists the official system extensions available for the requested Talos version.
  security: []
  responses:
    '200':
      description: Official system extensions for the Talos version.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/Extension"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
