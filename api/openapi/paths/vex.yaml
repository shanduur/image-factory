parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: getVEX
  summary: Get the Talos VEX document
  tags:
  - Enterprise Frontend API
  description: >-
    Returns the JSON VEX document published for the requested Talos release.
  x-image-factory-access:
    machineScope: denied
    ownership: not-applicable
  x-image-factory-min-talos-version: v1.13.0
  x-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/JSONArtifact"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headVEX
  summary: Inspect the Talos VEX document
  tags:
  - Enterprise Frontend API
  description: >-
    Returns VEX document status and headers without returning the document body.
  x-image-factory-access:
    machineScope: denied
    ownership: not-applicable
  x-image-factory-min-talos-version: v1.13.0
  x-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
