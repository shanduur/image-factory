parameters:
- $ref: ../components/parameters.yaml#/RegistryNameTail
- $ref: ../components/parameters.yaml#/OCIDigest
- $ref: ../components/parameters.yaml#/ArtifactType
get:
  operationId: getRegistryReferrers
  summary: Discover or proxy OCI referrers
  tags:
  - OCI Registry API
  description: >-
    Returns the OCI referrers index for a subject digest, from Image Factory or an upstream registry.
  x-image-factory-access:
    machineScope: allowed
    ownership: conditional
    ownershipDescription: >-
      Enforced for generated installer repositories and not applied to source-image proxy repositories.
  responses:
    '200':
      $ref: "../components/responses.yaml#/OCIIndexResponse"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headRegistryReferrers
  summary: Inspect OCI referrers
  tags:
  - OCI Registry API
  description: >-
    Returns OCI referrers status and headers without returning the index body.
  x-image-factory-access:
    machineScope: allowed
    ownership: conditional
    ownershipDescription: >-
      Enforced for generated installer repositories and not applied to source-image proxy repositories.
  responses:
    '200':
      $ref: "../components/responses.yaml#/OCIIndexHeaders"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
