parameters:
- $ref: ../components/parameters.yaml#/RegistryNameTail
- $ref: ../components/parameters.yaml#/OCIReference
get:
  operationId: getRegistryManifest
  summary: Get, build, or proxy an OCI manifest
  tags:
  - OCI Registry API
  description: >-
    Returns, builds, or proxies an OCI manifest for the requested repository reference.
  x-image-factory-access:
    machineScope: allowed
    ownership: conditional
    ownershipDescription: >-
      Enforced for generated installer repositories and not applied to source-image proxy repositories.
  responses:
    '200':
      $ref: "../components/responses.yaml#/OCIResponse"
    '307':
      $ref: "../components/responses.yaml#/TemporaryRedirect"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headRegistryManifest
  summary: Inspect an OCI manifest
  tags:
  - OCI Registry API
  description: >-
    Returns OCI manifest status and headers without returning the manifest body.
  x-image-factory-access:
    machineScope: allowed
    ownership: conditional
    ownershipDescription: >-
      Enforced for generated installer repositories and not applied to source-image proxy repositories.
  responses:
    '200':
      $ref: "../components/responses.yaml#/OCIResponse"
    '307':
      $ref: "../components/responses.yaml#/TemporaryRedirect"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
